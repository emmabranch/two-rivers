<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero test: Source to Sea</title>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=bricolage-grotesque:400,700,800|space-mono:400,700&display=swap">
<style>
:root{--ink:#111111;--paper:#F3EEE3;--river:#FF2E97;--river-light:#FF5CB8;}
body[data-river="eden"]{--river:#FFC800;--river-light:#FFD23F;}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.stage{position:relative;height:100svh;min-height:560px;overflow:hidden;border-bottom:3px solid var(--ink)}
.scene{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s ease}
body[data-river="fraser"] #eden-scene, body[data-river="eden"] #fraser-scene{opacity:0;visibility:hidden}
@media (prefers-reduced-motion: reduce){.scene{transition:none}}
.card{position:absolute;left:clamp(16px,4vw,56px);top:clamp(16px,6vh,64px);width:min(560px,calc(100% - 32px));background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:20px 22px 18px}
.eyebrow{font-family:"Space Mono",monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.card h1{font-weight:800;font-size:clamp(1.9rem,4.6vw,3.2rem);line-height:1.02;margin:8px 0 10px;letter-spacing:-.01em}
.card h1 .f{color:#C4006A} .card h1 .e{color:#7D5A00}
.card .lede{margin:0 0 14px;font-size:clamp(.98rem,1.6vw,1.1rem);line-height:1.45}
.card img.mot{float:right;width:64px;height:64px;margin:0 0 6px 10px}
.switch{display:flex;gap:10px;flex-wrap:wrap}
.switch button{font:700 1rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;padding:10px 14px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink);text-align:left;min-width:150px}
.switch button small{display:block;font:400 .72rem/1.3 "Space Mono",monospace;margin-top:2px}
.switch button[aria-pressed="true"]#btn-fraser{background:#FF2E97}
.switch button[aria-pressed="true"]#btn-eden{background:#FFC800}
.switch button:focus-visible{outline:3px solid #2340FF;outline-offset:3px}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 14px;font-family:"Space Mono",monospace;font-weight:700;font-size:.85rem;white-space:nowrap}
.cue .arrow{display:inline-block;margin-left:6px}
.after{max-width:720px;margin:48px auto;padding:0 20px;font-family:"Space Mono",monospace;font-size:.85rem}
@media (max-width:640px){.card{padding:16px} .card img.mot{width:48px;height:48px} .switch button{min-width:0;flex:1}}
</style></head>

<script>
const LEDE={fraser:"Follow the Fraser from the Rockies to the Salish Sea: floods, smoke, and salmon, told with open data.",
 eden:"Follow the Eden from the Cumbrian fells to the Solway Firth. The Eden's chapters are coming."};
const CUE={fraser:"Scroll to follow the Fraser",eden:"The Eden's story is coming"};

 document.getElementById("btn-eden").setAttribute("aria-pressed",r==="eden");

document.getElementById("btn-eden").onclick=()=>pick("eden");
</script></body></html>
